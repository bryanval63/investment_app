server {
    # 1. On écoute sur le port 8443 avec le SSL activé
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name bryannas.tail3a42eb.ts.net;

    # 2. Chemins vers les certificats à l'intérieur du conteneur Docker
    ssl_certificate /etc/nginx/ssl/dashboard.crt;
    ssl_certificate_key /etc/nginx/ssl/dashboard.key;

    # 3. Servir l'application React static
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 4. Rediriger toutes les requêtes /api vers le conteneur NestJS
    location /api/ {
        # 'backend' correspond au nom du service dans ton docker-compose.yml
        proxy_pass http://backend:3000/;
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}